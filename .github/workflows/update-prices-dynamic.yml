name: Update Prices (Dynamic System)

on:
  schedule:
    # A cada 3 horas. Todos os produtos atuais são cold e o job processa até
    # 1.000 por execução; 8 execuções/dia ainda cobrem os 6.854 produtos com
    # margem, mantendo a atualização obrigatória de 24 horas.
    - cron: "0 */3 * * *"

  workflow_dispatch:

jobs:
  update-prices-dynamic:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: update-prices-dynamic
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Update Amazon prices (Dynamic)
        run: npx tsx scripts/z-UpdatePrices.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AMAZON_ACCESS_KEY: ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY: ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          AMAZON_REGION: "us-east-1"
          AMAZON_HOST: "webservices.amazon.com.br"
          AMAZON_API_PROVIDER: "creators"
          AMAZON_DISABLE_PAAPI_FALLBACK: "1"
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
          AMAZON_CREATORS_VERSION: ${{ secrets.AMAZON_CREATORS_VERSION }}
          SCHEDULER_V2_ENABLED: ${{ vars.SCHEDULER_V2_ENABLED }}
          SCHEDULER_V2_OBSERVATION_LEDGER_ENABLED: ${{ vars.SCHEDULER_V2_OBSERVATION_LEDGER_ENABLED }}
          SCHEDULER_V2_URGENT_QUEUE_ENABLED: ${{ vars.SCHEDULER_V2_URGENT_QUEUE_ENABLED }}
          SCHEDULER_V2_ROLLOUT_PERCENTAGE: ${{ vars.SCHEDULER_V2_ROLLOUT_PERCENTAGE }}
          SCHEDULER_V2_PHASE_ANCHOR_AT: ${{ vars.SCHEDULER_V2_PHASE_ANCHOR_AT }}

      - name: Record Scheduler V2 shadow decisions
        if: vars.SCHEDULER_V2_SHADOW_MODE == 'true'
        run: npx tsx scripts/shadowSchedulerV2.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCHEDULER_V2_SHADOW_MODE: ${{ vars.SCHEDULER_V2_SHADOW_MODE }}
